name: One-shot SHPD 4.0.3 source integration
on:
  push:
    branches:
      - feature/shpd-4.0.3
    paths:
      - .github/workflows/merge-shpd-4.0.3.yml

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out the independent integration branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Merge the exact official v4.0.3 source tag
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add official-game https://github.com/00-Evan/shattered-pixel-dungeon.git
          git fetch --no-tags official-game refs/tags/v4.0.3
          test "$(git rev-parse FETCH_HEAD)" = "0fbf411d7e785c4cd99e2459d5361e2c534d65f6"
          if ! git merge --no-commit --no-ff -X ours FETCH_HEAD; then
            echo 'Unresolved conflict paths:'
            git diff --name-only --diff-filter=U
            exit 1
          fi
          if test -n "$(git ls-files --unmerged)"; then
            git ls-files --unmerged
            exit 1
          fi
          git status --short
      - name: Repair four merge-induced source incompatibilities
        shell: bash
        run: |
          from pathlib import Path
          
          root = Path("core/src/main/java/com/shatteredpixel/shatteredpixeldungeon")
          catalog = root / "journal/Catalog.java"
          s = catalog.read_text()
          if "seenClasses = Arrays.asList(" in s and "import java.util.Arrays;" not in s:
              s = s.replace("seenClasses = Arrays.asList(", "seenClasses = java.util.Arrays.asList(")
          if "public static void unload(" not in s:
              pos = s.rfind("\n}")
              assert pos > 0
              s = s[:pos] + """
              public static void unload() {
                  for (Catalog cat : values()) {
                      for (Class<? extends Item> item : cat.seen.keySet()) {
                          cat.seen.put(item, false);
                      }
                  }
              }
          """ + s[pos:]
          catalog.write_text(s)
          
          settings = root / "windows/WndSettings.java"
          s = settings.read_text()
          if "NoosaScript.brightness(" in s and "import com.watabou.noosa.NoosaScript;" not in s:
              assert "import com.watabou.noosa.Game;" in s
              s = s.replace("import com.watabou.noosa.Game;", "import com.watabou.noosa.Game;\nimport com.watabou.noosa.NoosaScript;")
          settings.write_text(s)
          
          backup = root / "windows/WndAndroidLocalBackupRestore.java"
          s = backup.read_text()
          old = 'Messages.get(WndJournal.BadgesTab.class, "title")'
          replacement = 'Messages.get("windows.wndjournal$badgestab.title")'
          assert old in s or replacement in s
          s = s.replace(old, replacement)
          backup.write_text(s)
          print("Applied Catalog, Settings and backup compatibility fixes")
      - name: Compile core and iOS source, run core tests
        run: ./gradlew :core:compileJava :ios:compileJava :core:test --stacktrace --no-daemon
      - name: Commit and push only after validation
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git commit -m "merge official SHPD v4.0.3 preserving seedfinder customizations"
          git push origin HEAD:refs/heads/feature/shpd-4.0.3
