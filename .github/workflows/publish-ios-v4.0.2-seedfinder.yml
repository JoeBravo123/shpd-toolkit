name: Publish verified SHPD Toolkit iOS release

on:
  push:
    branches:
      - release/v4.0.2-toolkit-1.7-ios.2

permissions:
  contents: write
  actions: read

jobs:
  publish:
    name: Publish LiveContainer IPA
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download previously built IPA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          gh run download 42378048882 --repo "$GITHUB_REPOSITORY" --name shpd-toolkit-ios-livecontainer --dir dist
          test -f dist/IOSLauncher.ipa
          echo 'f71c624d6d504af7754353f34cdbe28fcb031acbb7a7b9fdfba02a3257afce36  dist/IOSLauncher.ipa' | sha256sum --check
          mv dist/IOSLauncher.ipa dist/shpd-toolkit-4.0.2-seedfinder-livecontainer.ipa
          (cd dist && sha256sum shpd-toolkit-4.0.2-seedfinder-livecontainer.ipa > SHA256SUMS.txt)

      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
          ## SHPD Toolkit 4.0.2 · iOS LiveContainer · Seedfinder improvements

          This is an unsigned arm64 IPA for LiveContainer, built from commit `b89323d387ee91482e073d71a0785ff420af3aea`.
          This release is separate from and does not overwrite `v4.0.2-toolkit-1.7`.

          ### Changes
          - Show the number of secret rooms directly on the **Items** tab when a floor contains hidden rooms. The Rooms tab remains available.
          - Display thrown weapons, runestones, food and special supplies (including honeypots) in dedicated seed-analysis categories, enabled by default.
          - Recognize blandfruit bushes as an obtainable blandfruit source in both seed analysis and seed search.
          - Include Simplified Chinese and English labels for the new categories and secret-room indicator.

          ### Verification
          - Java and core Gradle tasks succeeded.
          - iOS arm64 IPA build and artifact upload succeeded in [GitHub Actions run #3](https://github.com/JoeBravo123/shpd-toolkit/actions/runs/42378048882).
          - User confirmed the secret-room indicator works on device.
          - The downloadable IPA SHA-256 is also recorded in `SHA256SUMS.txt`.

          **Install:** Import the unsigned IPA into LiveContainer. This is not a signed App Store IPA.
          EOF
          gh release create 'v4.0.2-toolkit-1.7-ios.2' \
            dist/shpd-toolkit-4.0.2-seedfinder-livecontainer.ipa \
            dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target 'b89323d387ee91482e073d71a0785ff420af3aea' \
            --title 'SHPD Toolkit 4.0.2 - iOS LiveContainer (Seedfinder update)' \
            --notes-file release-notes.md
