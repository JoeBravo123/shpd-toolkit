name: Build iOS IPA for LiveContainer

on:
  workflow_dispatch:
  push:
    branches:
      - seedfinder
      - feature/shpd-4.0.3
    paths:
      - 'core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/SeedFinder.java'
      - 'core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/windows/WndSeedfinderLog.java'
      - 'core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/SPDSettings.java'
      - 'core/src/main/assets/messages/**'
      - 'core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/ui/**'
      - 'core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/Chrome.java'
      - 'core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/scenes/TitleScene.java'
      - 'core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/windows/**'
      - 'build.gradle'
      - '.github/workflows/build-ios-livecontainer.yml'

permissions:
  contents: read

concurrency:
  group: ios-livecontainer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned arm64 IPA
    runs-on: macos-15-intel
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Restore RoboVM cache
        uses: actions/cache@v4
        with:
          path: ~/.robovm/cache
          key: robovm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build.gradle', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties', 'ios/build.gradle', 'ios/robovm.xml') }}
          restore-keys: |
            robovm-${{ runner.os }}-${{ runner.arch }}-

      - name: Compile and run core tests
        run: ./gradlew :core:compileJava :ios:compileJava :core:test --stacktrace --no-daemon

      - name: Build unsigned IPA
        run: ./gradlew ios:createIPA -Probovm.archs=arm64 -Probovm.iosSkipSigning=true --stacktrace --no-daemon

      - name: Upload IPA
        uses: actions/upload-artifact@v6
        with:
          name: shpd-toolkit-ios-livecontainer
          path: ios/build/robovm/**/*.ipa
          if-no-files-found: error
          retention-days: 7
